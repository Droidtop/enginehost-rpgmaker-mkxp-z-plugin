name: Build enginehost RPG Maker plugin

on:
  push:
    branches: [plugin-core, "plugin/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Droidtop/enginehost
          ref: codex/engine-bundles
          path: enginehost-tooling
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Fetch Android dependencies selected by the port
        working-directory: android/app/jni
        run: bash -e ./get_deps.sh
      - name: Cross-compile native support libraries
        working-directory: android/app/jni
        run: |
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          make all ARCH=linux-x86_64 ABI=armeabi-v7a HOST=armv7a-linux-androideabi TARGET=arm-linux-androideabi
          bash ./verify-native-build.sh armeabi-v7a
          make clean-iconv clean-openssl clean-ruby ARCH=linux-x86_64 ABI=arm64-v8a HOST=aarch64-linux-android TARGET=aarch64-linux-android
          make all ARCH=linux-x86_64 ABI=arm64-v8a HOST=aarch64-linux-android TARGET=aarch64-linux-android
          bash ./verify-native-build.sh arm64-v8a
      - name: Generate embedded mkxp-z assets and shaders
        working-directory: android/app/jni
        run: bash ./generate_xxd.sh
      - name: Build APK
        working-directory: android
        run: |
          bash ./gradlew :app:assembleDebug --stacktrace
          echo "APKs produced:"
          ls -l app/build/outputs/apk/debug
          apk="$(find app/build/outputs/apk/debug -name '*universal*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "no universal APK found in app/build/outputs/apk/debug" >&2
            exit 1
          fi
          echo "selected $apk"
          bash ./verify-apk-native.sh "$apk"
      - name: Build signed internal Enginehost bundle
        if: startsWith(github.ref, 'refs/heads/plugin/')
        env:
          ENGINEHOST_SIGNING_KEY_PEM: ${{ secrets.ENGINEHOST_SIGNING_KEY_PEM }}
        run: |
          # This step is a long chain of bare `test`s; without tracing, any one
          # of them fails the job silently after a ~25 minute build.
          set -x
          test -n "$ENGINEHOST_SIGNING_KEY_PEM"
          apk="$(find android/app/build/outputs/apk/debug -name '*universal*.apk' -print -quit)"
          test -f "$apk"
          mkdir -p build/payload build/output
          cp "$apk" build/payload/runtime.apk
          unzip -q "$apk" 'classes*.dex' 'lib/*' -d build/payload
          test -f build/payload/classes.dex
          # Multidex is expected: two Ruby runtimes plus mkxp-z do not fit
          # in one dex. Record what is actually there, in load order, so
          # the bundle declares every dex rather than the first one.
          python3 - <<'DEXES'
          import json, pathlib, re
          payload = pathlib.Path('build/payload')
          def order(p):
              # classes.dex, classes2.dex, ... classes10.dex -- numeric,
              # since a lexical sort puts 10 before 2.
              m = re.fullmatch(r'classes(\d*)\.dex', p.name)
              return int(m.group(1) or 1)
          dexes = sorted(payload.glob('classes*.dex'), key=order)
          assert dexes, 'no classes*.dex in the APK payload'
          meta = pathlib.Path('enginehost/bundle-metadata.json')
          data = json.loads(meta.read_text())
          data['dexFiles'] = [d.name for d in dexes]
          meta.write_text(json.dumps(data, indent=2) + '\n')
          print('dexFiles =', data['dexFiles'])
          DEXES
          copy_ruby_runtime() {
            runtime=$1
            version=$2
            for abi in armeabi-v7a arm64-v8a; do
              source="android/app/jni/build-$abi/${runtime:+$runtime/}lib/ruby/$version"
              if [ "$runtime" = ruby31 ]; then
                source="android/app/jni/build-$abi/lib/ruby/$version"
              fi
              test -d "$source"
              mkdir -p "build/payload/runtime/$runtime/$abi"
              arch_dir="$(find "$source" -mindepth 1 -maxdepth 1 -type d \( -name '*linux*' -o -name '*android*' \) -print -quit)"
              test -n "$arch_dir"
              cp -a "$arch_dir"/. "build/payload/runtime/$runtime/$abi/"
              if [ "$abi" = armeabi-v7a ]; then
                mkdir -p "build/payload/runtime/$runtime/common"
                find "$source" -mindepth 1 -maxdepth 1 ! -path "$arch_dir" -exec cp -a -t "build/payload/runtime/$runtime/common" -- {} +
              fi
            done
          }
          copy_ruby_runtime ruby19 1.9.1
          copy_ruby_runtime ruby31 3.1.0
          test -n "$(find build/payload/runtime/ruby19/armeabi-v7a -type f -name '*.so' -print -quit)"
          test -n "$(find build/payload/runtime/ruby31/arm64-v8a -type f -name '*.so' -print -quit)"
          test -f build/payload/runtime/ruby19/common/fileutils.rb
          cp enginehost/LICENSES.md build/payload/LICENSES.md
          cp COPYING build/payload/COPYING.mkxp-z
          cp THIRD_PARTY.md build/payload/THIRD_PARTY.md
          set +x  # keep the signing key out of the trace
          printf '%s' "$ENGINEHOST_SIGNING_KEY_PEM" > build/signing-key.pem
          set -x
          python3 enginehost-tooling/scripts/build-engine-bundle.py \
            --metadata enginehost/bundle-metadata.json --payload build/payload \
            --private-key build/signing-key.pem \
            --repository-key-document enginehost-public-key.json \
            --output build/output/dev.enginehost.rpgmaker.rgss.v1.enginehost.tar.xz \
            --release-envelope build/output/enginehost-release.json \
            --public-key-document build/output/enginehost-public-key.json
          cmp enginehost-public-key.json build/output/enginehost-public-key.json
      - uses: actions/upload-artifact@v4
        with:
          name: enginehost-rpgmaker-plugin-debug-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            build/output/*
          if-no-files-found: error
