name: Build enginehost RPG Maker plugin

on:
  push:
    branches: ["plugin/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Promote this build to a GitHub Release on the chosen channel. Stable is
          for a bundle that has been used with real games on hardware; testing
          for one that runs games but has not been lived with. Every push
          already publishes to the unstable channel by itself.
        type: boolean
        default: false
      channel:
        description: "Release channel for a promoted build"
        type: choice
        options: [stable, testing]
        default: stable
      tag:
        description: "Release tag (default: derived from the bundle id; testing adds -testing)"
        type: string
        default: ""

permissions:
  contents: read

# One agent push supersedes the previous one instead of racing it. Before
# this, every push queued another full build and nothing cancelled the run
# it had just obsoleted, so a five-push fix session burned five builds and
# could email five failures for one problem. Keyed on the ref, so branches
# and PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # Builds and packs the payload. No signing key and no write token here:
    # the dependency downloads, native builds, Gradle and its plugins run in
    # this job (Enginehost docs/security/2026-09-24-ci-supply-chain.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Fetch Android dependencies selected by the port
        working-directory: android/app/jni
        run: bash -e ./get_deps.sh
      - name: Cross-compile native support libraries
        working-directory: android/app/jni
        run: |
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          make all ARCH=linux-x86_64 ABI=armeabi-v7a HOST=armv7a-linux-androideabi TARGET=arm-linux-androideabi
          bash ./verify-native-build.sh armeabi-v7a
          make clean-iconv clean-openssl clean-ruby ARCH=linux-x86_64 ABI=arm64-v8a HOST=aarch64-linux-android TARGET=aarch64-linux-android
          make all ARCH=linux-x86_64 ABI=arm64-v8a HOST=aarch64-linux-android TARGET=aarch64-linux-android
          bash ./verify-native-build.sh arm64-v8a
      - name: Generate embedded mkxp-z assets and shaders
        working-directory: android/app/jni
        run: bash ./generate_xxd.sh
      - name: Build APK
        working-directory: android
        run: |
          bash ./gradlew :app:assembleDebug --stacktrace
          echo "APKs produced:"
          ls -l app/build/outputs/apk/debug
          apk="$(find app/build/outputs/apk/debug -name '*universal*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "no universal APK found in app/build/outputs/apk/debug" >&2
            exit 1
          fi
          echo "selected $apk"
          bash ./verify-apk-native.sh "$apk"
      - name: Pack the unsigned bundle inputs
        if: startsWith(github.ref, 'refs/heads/plugin/')
        run: |
          # This step is a long chain of bare `test`s; without tracing, any one
          # of them fails the job silently after a ~25 minute build.
          set -x
          apk="$(find android/app/build/outputs/apk/debug -name '*universal*.apk' -print -quit)"
          test -f "$apk"
          mkdir -p build/unsigned/payload
          cp "$apk" build/unsigned/payload/runtime.apk
          unzip -q "$apk" 'classes*.dex' 'lib/*' -d build/unsigned/payload
          test -f build/unsigned/payload/classes.dex
          # Multidex is expected: two Ruby runtimes plus mkxp-z do not fit
          # in one dex. Record what is actually there, in load order, so
          # the bundle declares every dex rather than the first one.
          python3 - <<'DEXES'
          import json, pathlib, re
          payload = pathlib.Path('build/unsigned/payload')
          def order(p):
              # classes.dex, classes2.dex, ... classes10.dex -- numeric,
              # since a lexical sort puts 10 before 2.
              m = re.fullmatch(r'classes(\d*)\.dex', p.name)
              return int(m.group(1) or 1)
          dexes = sorted(payload.glob('classes*.dex'), key=order)
          assert dexes, 'no classes*.dex in the APK payload'
          data = json.loads(pathlib.Path('enginehost/bundle-metadata.json').read_text())
          data['dexFiles'] = [d.name for d in dexes]
          pathlib.Path('build/unsigned/bundle-metadata.json').write_text(json.dumps(data, indent=2) + '\n')
          print('dexFiles =', data['dexFiles'])
          DEXES
          copy_ruby_runtime() {
            runtime=$1
            version=$2
            for abi in armeabi-v7a arm64-v8a; do
              source="android/app/jni/build-$abi/${runtime:+$runtime/}lib/ruby/$version"
              if [ "$runtime" = ruby31 ]; then
                source="android/app/jni/build-$abi/lib/ruby/$version"
              fi
              test -d "$source"
              mkdir -p "build/unsigned/payload/runtime/$runtime/$abi"
              arch_dir="$(find "$source" -mindepth 1 -maxdepth 1 -type d \( -name '*linux*' -o -name '*android*' \) -print -quit)"
              test -n "$arch_dir"
              cp -a "$arch_dir"/. "build/unsigned/payload/runtime/$runtime/$abi/"
              if [ "$abi" = armeabi-v7a ]; then
                mkdir -p "build/unsigned/payload/runtime/$runtime/common"
                find "$source" -mindepth 1 -maxdepth 1 ! -path "$arch_dir" -exec cp -a -t "build/unsigned/payload/runtime/$runtime/common" -- {} +
              fi
            done
          }
          copy_ruby_runtime ruby19 1.9.1
          copy_ruby_runtime ruby31 3.1.0
          test -n "$(find build/unsigned/payload/runtime/ruby19/armeabi-v7a -type f -name '*.so' -print -quit)"
          test -n "$(find build/unsigned/payload/runtime/ruby31/arm64-v8a -type f -name '*.so' -print -quit)"
          test -f build/unsigned/payload/runtime/ruby19/common/fileutils.rb
          cp enginehost/LICENSES.md build/unsigned/payload/LICENSES.md
          cp COPYING build/unsigned/payload/COPYING.mkxp-z
          cp THIRD_PARTY.md build/unsigned/payload/THIRD_PARTY.md
          # A tar keeps the file modes the manifest signs; an artifact would not.
          tar -cf build/unsigned.tar -C build/unsigned payload bundle-metadata.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enginehost-rpgmaker-plugin-debug-apks
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(github.ref, 'refs/heads/plugin/')
        with:
          name: enginehost-rpgmaker-rgss-bundle-unsigned
          path: build/unsigned.tar
          if-no-files-found: error

  sign:
    # Enginehost's one signing mechanism, pinned by commit: the key never
    # shares a runner with the build. Only plugin/* lines make a bundle; on
    # any other ref this and the publish jobs after it are skipped.
    needs: android
    if: startsWith(github.ref, 'refs/heads/plugin/')
    permissions:
      contents: read
    uses: Droidtop/enginehost/.github/workflows/sign-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      unsigned-artifact: enginehost-rpgmaker-rgss-bundle-unsigned
      bundle: dev.enginehost.rpgmaker.rgss.v1.enginehost.tar.xz
      artifact-name: enginehost-rpgmaker-rgss-bundle
      channel: ${{ inputs.channel }}
    secrets:
      ENGINEHOST_SIGNING_KEY_PEM: ${{ secrets.ENGINEHOST_SIGNING_KEY_PEM }}

  publish:
    # Promotion is deliberate: a manual dispatch names the channel. Stable
    # means used with real games on hardware; testing means it runs games
    # but has not been lived with. Enginehost offers each person the channel
    # they chose in Settings and every steadier one. The release logic lives
    # once, in Droidtop/enginehost (Droidtop/tracker#196).
    needs: sign
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    permissions:
      contents: write
    uses: Droidtop/enginehost/.github/workflows/publish-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      artifact-name: enginehost-rpgmaker-rgss-bundle
      channel: ${{ inputs.channel }}
      tag: ${{ inputs.tag }}
    secrets:
      PLATFORMS_DISPATCH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}

  unstable:
    # Every green push that produced a signed bundle is published as-is on
    # the unstable channel, replacing the previous one, so a person who opted
    # into unstable in Enginehost sees each build the moment CI is done with
    # it, and the build also gets its permanent history release. Branches
    # whose build makes no bundle publish nothing.
    needs: sign
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    uses: Droidtop/enginehost/.github/workflows/publish-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      artifact-name: enginehost-rpgmaker-rgss-bundle
      channel: unstable
    secrets:
      PLATFORMS_DISPATCH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}
