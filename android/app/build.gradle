plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hatkid.mkxpz'
    compileSdk 33

    androidResources {
        // Enginehost attaches this APK's resources to the host's own
        // Resources object. Both would be compiled at the default package
        // id 0x7f and the host's table wins every lookup, so the host now
        // refuses a bundle compiled there. Compile ours where the host
        // will never be, as the Godot bundle does.
        additionalParameters += ["--package-id", "0x80", "--allow-reserved-package-id"]
    }

    defaultConfig {
        applicationId "dev.enginehost.plugin.rpgmaker.slot1"
        minSdk 21
        targetSdk 33
        versionCode 11
        versionName "0.1.0"
        archivesBaseName = "enginehost-rpgmaker-$versionName"
        ndk.debugSymbolLevel = 'FULL'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            debuggable true
            jniDebuggable true
        }
    }

    splits {
        abi {
            enable true
            reset()
            // An enginehost bundle carries every ABI it supports in one
            // archive and the host picks lib/<abi> from Build.SUPPORTED_ABIS,
            // so x86_64 is not an AVD convenience here: it is half of what
            // ships. Only 32-bit x86 is left out, having no device behind it.
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "jni/Android.mk"
        }
    }
}

dependencies {
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
}
